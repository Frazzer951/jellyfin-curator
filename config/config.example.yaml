# jellyfin-curator config
# Copy to config.yaml. ${VAR} references are expanded from the environment.

jellyfin:
  url: ${JELLYFIN_URL} # set in .env
  api_key: ${JELLYFIN_API_KEY} # set in .env (Dashboard → API Keys)
  user: your-jellyfin-user # whose watch state drives the watch-based rules

# Simkl watchlists for TV and movies (optional). Register an app at
# https://simkl.com/settings/developer/ (AUTH V2, "TV, devices & command line"),
# then run `jfcurator simkl-auth` once to link your account.
simkl:
  client_id: ${SIMKL_CLIENT_ID} # set in .env

options:
  page_size: 500
  name_prefix: "" # e.g. "⚙ " to visually tag managed playlists
  log_dir: logs # per-run summary + debug log, relative to this file; null disables
  keep_runs: 100 # runs' worth of files to keep; 0 keeps all

libraries:
  # Key must match the Jellyfin library name exactly (case-insensitive).
  Anime Shows:
    rules:
      Anime - Missing Subtitles:
        type: media_filter
        item_type: episode
        match:
          subtitles:
            present: false
        sort: series

      Anime - Missing Japanese Audio:
        type: media_filter
        item_type: episode
        match:
          audio:
            missing_language: [jpn]
            undefined_as_expected: true # untagged (und) tracks count as Japanese
        # Per-series exceptions: replaces `audio` and/or `subtitles` for these shows.
        # Run `jfcurator languages "Anime Shows"` to see how tracks are actually tagged.
        overrides:
          - series: [Example Donghua, Another Donghua] # e.g. Chinese-audio shows
            match:
              audio:
                missing_language: [chi, zho]
        sort: series

      Anime - Continue Watching:
        type: continue_watching
        episodes_per_series: 1
        sort: last_played desc
        limit: 50
        exclude: [Dropped] # skip shows on the AniList Dropped list

      Anime - New Seasons:
        type: new_seasons
        sort: last_played desc

  Shows:
    rules:
      TV - Continue Watching:
        type: continue_watching
        sort: last_played desc
        exclude: [TV - Dropped]
      TV - New Seasons:
        type: new_seasons
        sort: last_played desc

# Collections are global in Jellyfin, so ones that draw from several libraries
# live here rather than under `libraries:`. Each name is one collection.
# `exclude` drops anything another rule selected (by series/movie).
# `sort_title` controls where it sits in the Collections view.
collections:
  # --- AniList (public lists; no account link needed) -----------------------
  Planning to Watch:
    type: anilist_list
    libraries: [Anime Shows, Anime Movies]
    username: your-anilist-username
    status: planning # planning | current (watching) | paused | dropped | completed | repeating
    sort_title: +1.0_Planning to Watch

  Currently Watching:
    type: anilist_list
    libraries: [Anime Shows]
    username: your-anilist-username
    status: current
    sort_title: +1.1_Currently Watching

  Paused:
    type: anilist_list
    libraries: [Anime Shows]
    username: your-anilist-username
    status: paused
    sort_title: +1.2_Paused

  Dropped:
    type: anilist_list
    libraries: [Anime Shows]
    username: your-anilist-username
    status: dropped
    sort_title: +1.3_Dropped

  Completed:
    type: anilist_list
    libraries: [Anime Shows, Anime Movies]
    username: your-anilist-username
    status: completed
    sort_title: +1.4_Completed

  No Collection:
    type: all_items
    libraries: [Anime Shows, Anime Movies]
    exclude: [Planning to Watch, Currently Watching, Paused, Dropped, Completed]
    sort_title: +1.5_No Collection

  AniList Top Rated:
    type: anilist_top_rated
    libraries: [Anime Shows, Anime Movies]
    count: 200 # top N on AniList, before matching against the library
    sort_title: +0.0_Top Rated

  # --- Simkl (TV and movies; needs the `simkl:` section above) --------------
  TV - Planning to Watch:
    type: simkl_list
    libraries: [Shows]
    status: planning # planning | watching | paused (hold) | dropped | completed
    sort_title: +2.0_TV Planning to Watch

  TV - Currently Watching:
    type: simkl_list
    libraries: [Shows]
    status: watching
    sort_title: +2.1_TV Currently Watching

  TV - Paused:
    type: simkl_list
    libraries: [Shows]
    status: paused
    sort_title: +2.2_TV Paused

  TV - Dropped:
    type: simkl_list
    libraries: [Shows]
    status: dropped
    sort_title: +2.3_TV Dropped

  TV - Completed:
    type: simkl_list
    libraries: [Shows]
    status: completed
    sort_title: +2.4_TV Completed

  TV - No Collection:
    type: all_items
    libraries: [Shows]
    exclude:
      [
        TV - Planning to Watch,
        TV - Currently Watching,
        TV - Paused,
        TV - Dropped,
        TV - Completed,
      ]
    sort_title: +2.5_TV No Collection

  # Simkl movies only have planning, dropped and completed.
  Movies - Planning to Watch:
    type: simkl_list
    libraries: [Movies]
    status: planning
    sort_title: +3.0_Movies Planning to Watch

  Movies - Dropped:
    type: simkl_list
    libraries: [Movies]
    status: dropped
    sort_title: +3.1_Movies Dropped

  Movies - Completed:
    type: simkl_list
    libraries: [Movies]
    status: completed
    sort_title: +3.2_Movies Completed

  Movies - No Collection:
    type: all_items
    libraries: [Movies]
    exclude: [Movies - Planning to Watch, Movies - Dropped, Movies - Completed]
    sort_title: +3.3_Movies No Collection

  # --- Watch state ----------------------------------------------------------
  Binge:
    type: binge # started, with unwatched episodes left
    libraries: [Anime Shows, Shows]
    exclude: [Dropped, TV - Dropped]
    sort_title: ++Binge
    summary: Started shows with unwatched episodes left.

  Binge Ended:
    type: binge
    libraries: [Anime Shows, Shows]
    series_status: [ended]
    exclude: [Dropped, TV - Dropped]
    sort_title: ++BingeEnded
    summary: Started shows that have ended production, with unwatched episodes left.

  Not Started:
    type: not_started
    libraries: [Anime Shows, Shows]
    sort_title: ++a_NotStarted
    summary: Shows that haven't been started yet.
